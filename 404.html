<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Mitul Kheni | Portfolio</title>
		<!-- GitHub Pages has no rewrites, so deep links like /Portfolio/contact land here.
		     Redirect to /Portfolio/?/contact; index.html restores the real path.
		     https://github.com/rafgraph/spa-github-pages -->
		<script>
			// One path segment ("/Portfolio") belongs to the repo, not the app route.
			var pathSegmentsToKeep = 1;

			var l = window.location;
			l.replace(
				l.protocol +
					'//' +
					l.hostname +
					(l.port ? ':' + l.port : '') +
					l.pathname
						.split('/')
						.slice(0, 1 + pathSegmentsToKeep)
						.join('/') +
					'/?/' +
					l.pathname
						.slice(1)
						.split('/')
						.slice(pathSegmentsToKeep)
						.join('/')
						.replace(/&/g, '~and~') +
					(l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
					l.hash,
			);
		</script>
	</head>
	<body></body>
</html>
